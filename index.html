<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai dátum</title>
</head>
<body>

    <h1>Mai dátum:</h1>
    <h2 id="datum"></h2>

    <script>
        const maiDatum = new Date();

        const datum = maiDatum.toLocaleDateString("hu-HU", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });

        document.getElementById("datum").textContent = datum;
    </script>

</body>
</html>
