
<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mai dátum</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Mai dátum</h1>

        <h2 id="datum"></h2>

        <p class="footer">
            Automatikusan frissülő dátum
        </p>

    </div>

    <script>
        const maiDatum = new Date();

        const datum = maiDatum.toLocaleDateString("hu-HU", {
            year: "numeric",
            month: "long",
            day: "numeric"
        });

        document.getElementById("datum").textContent = datum;
    </script>

</body>
</html>
